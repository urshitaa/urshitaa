<!-- RIGHT SIDE CYBER PANEL -->

<g transform="translate(1060 120)">

  <!-- Outer Card -->
  <rect width="250"
        height="280"
        rx="20"
        fill="#03141f"
        stroke="#00ff88"
        stroke-width="2"/>

  <!-- Top Heading -->
  <text x="30"
        y="45"
        fill="#00ff88"
        font-size="28"
        font-family="Arial"
        font-weight="700">
    SYSTEM STATUS
  </text>

  <!-- Divider -->
  <line x1="25"
        y1="65"
        x2="220"
        y2="65"
        stroke="#00ff88"
        stroke-width="1"/>

  <!-- Status Items -->

  <!-- AI -->
  <circle cx="35" cy="100" r="7" fill="#00ff66">
    <animate attributeName="opacity"
             values="1;0.2;1"
             dur="1s"
             repeatCount="indefinite"/>
  </circle>

  <text x="55"
        y="106"
        fill="white"
        font-size="18"
        font-family="monospace">
    AI CORE ACTIVE
  </text>

  <!-- Neural -->
  <circle cx="35" cy="145" r="7" fill="#00d9ff">
    <animate attributeName="opacity"
             values="1;0.2;1"
             dur="1.5s"
             repeatCount="indefinite"/>
  </circle>

  <text x="55"
        y="151"
        fill="white"
        font-size="18"
        font-family="monospace">
    NEURAL ONLINE
  </text>

  <!-- Learning -->
  <circle cx="35" cy="190" r="7" fill="#00ff66">
    <animate attributeName="opacity"
             values="1;0.2;1"
             dur="0.8s"
             repeatCount="indefinite"/>
  </circle>

  <text x="55"
        y="196"
        fill="white"
        font-size="18"
        font-family="monospace">
    LEARNING MODE
  </text>

  <!-- Deploy -->
  <circle cx="35" cy="235" r="7" fill="#00d9ff">
    <animate attributeName="opacity"
             values="1;0.2;1"
             dur="1.2s"
             repeatCount="indefinite"/>
  </circle>

  <text x="55"
        y="241"
        fill="white"
        font-size="18"
        font-family="monospace">
    DEPLOY READY
  </text>

  <!-- Bottom Energy Line -->
  <rect x="25"
        y="255"
        width="190"
        height="8"
        rx="4"
        fill="#012a1a"/>

  <rect x="25"
        y="255"
        width="120"
        height="8"
        rx="4"
        fill="#00ff88">

    <animate attributeName="width"
             values="40;190;40"
             dur="3s"
             repeatCount="indefinite"/>
  </rect>

</g>
