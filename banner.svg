<svg width="1400" height="500" viewBox="0 0 1400 500" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Brain Glow -->
    <radialGradient id="brainGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#003311"/>
    </radialGradient>

    <!-- Portal Glow -->
    <radialGradient id="portalGradient">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#001a0d"/>
    </radialGradient>

  </defs>

  <!-- Background -->
  <rect width="1400" height="500" fill="black"/>

  <!-- Left Text -->
  <text x="70" y="120"
        fill="#00ff66"
        font-size="34"
        font-family="Poppins"
        letter-spacing="5">
    Hello World
  </text>

  <text x="70" y="220"
        fill="#00ff66"
        font-size="110"
        font-weight="700"
        font-family="Poppins"
        filter="url(#glow)">
    Urshitaa
  </text>

  <text x="75" y="290"
        fill="white"
        font-size="45"
        font-weight="700"
        font-family="Poppins">
    AI/ML ENGINEER
  </text>

  <!-- Progress Text -->
  <text x="70" y="410"
        fill="#00ff66"
        font-size="30"
        font-family="Poppins">
    Building the future ...
  </text>

  <!-- Progress Bar -->
  <rect x="70" y="440" width="450" height="30" rx="15"
        fill="#003311"
        stroke="#00ff66"
        stroke-width="2"/>

  <rect x="70" y="440" width="360" height="30" rx="15"
        fill="#00ff66">
    <animate attributeName="width"
             values="100;360;100"
             dur="4s"
             repeatCount="indefinite"/>
  </rect>

  <text x="540" y="463"
        fill="#00ff66"
        font-size="28"
        font-family="Poppins">
    90%
  </text>

  <!-- Rotating Brain -->
  <g transform="translate(800 200)">
    
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 0 0"
      to="360 0 0"
      dur="12s"
      repeatCount="indefinite"/>

    <path d="
      M-120,-20
      C-150,-100 -60,-160 20,-140
      C120,-180 200,-80 170,20
      C200,120 120,180 10,150
      C-100,190 -180,100 -150,10
      Z"
      fill="url(#brainGradient)"
      stroke="#00ff66"
      stroke-width="4"
      filter="url(#glow)"/>

    <!-- Brain Lines -->
    <path d="M-90 -20 C-30 -80 20 -60 70 -10"
          stroke="#00ff66"
          stroke-width="3"
          fill="none"/>

    <path d="M-60 50 C10 10 70 30 100 80"
          stroke="#00ff66"
          stroke-width="3"
          fill="none"/>

    <path d="M-30 -90 C20 -20 60 -30 110 20"
          stroke="#00ff66"
          stroke-width="3"
          fill="none"/>

  </g>

  <!-- Revolving Portal -->
  <g transform="translate(820 410)">
    
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 0 0"
      to="-360 0 0"
      dur="5s"
      repeatCount="indefinite"/>

    <!-- Rings -->
    <ellipse rx="100" ry="35"
             fill="url(#portalGradient)"
             stroke="#00ff66"
             stroke-width="3"
             filter="url(#glow)"/>

    <ellipse rx="70" ry="22"
             fill="none"
             stroke="#00ff66"
             stroke-width="2"/>

    <ellipse rx="40" ry="12"
             fill="none"
             stroke="#00ff66"
             stroke-width="2"/>

  </g>

  <!-- Portal Light -->
  <g>
    <line x1="820" y1="390" x2="820" y2="250"
          stroke="#00ff66"
          stroke-width="4"
          opacity="0.8">

      <animate attributeName="opacity"
               values="0.2;1;0.2"
               dur="2s"
               repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Right Side -->
  <text x="1120" y="140"
        fill="white"
        font-size="36"
        letter-spacing="6"
        font-family="Poppins">
    What I do
  </text>

  <!-- Skills -->
  <g fill="#00ff66" font-family="Poppins" font-size="24">

    <circle cx="1140" cy="200" r="18" fill="#00ff66"/>
    <text x="1132" y="208" fill="black">✓</text>
    <text x="1180" y="208" fill="white">Machine Learning</text>

    <circle cx="1140" cy="270" r="18" fill="#00ff66"/>
    <text x="1132" y="278" fill="black">✓</text>
    <text x="1180" y="278" fill="white">Deep Learning</text>

    <circle cx="1140" cy="340" r="18" fill="#00ff66"/>
    <text x="1132" y="348" fill="black">✓</text>
    <text x="1180" y="348" fill="white">Data Science</text>

    <circle cx="1140" cy="410" r="18" fill="#00ff66"/>
    <text x="1132" y="418" fill="black">✓</text>
    <text x="1180" y="418" fill="white">Web Development</text>

  </g>

</svg>
