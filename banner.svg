<svg width="100%" viewBox="0 0 680 220" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Urshitaa - AI/ML Engineer Profile Banner</title>
  <desc>Animated profile banner for Urshitaa, AI/ML Engineer, showing skills and a progress bar</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <pattern id="scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#00ff66" stroke-width="0.15" opacity="0.15"/>
    </pattern>

    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00cc55"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="bannerClip">
      <rect x="0" y="0" width="680" height="220" rx="12"/>
    </clipPath>
  </defs>

  <style>
    @keyframes spin { from { transform-origin: 310px 115px; transform: rotate(0deg); } to { transform-origin: 310px 115px; transform: rotate(360deg); } }
    @keyframes spinRev { from { transform-origin: 310px 115px; transform: rotate(0deg); } to { transform-origin: 310px 115px; transform: rotate(-360deg); } }
    @keyframes pulse { 0%,100%{r:8;opacity:1;} 50%{r:11;opacity:0.75;} }
    @keyframes fillBar { from { width: 0; } to { width: 333px; } }
    @keyframes fadeUp { from { opacity:0; transform: translateY(8px);} to { opacity:1; transform: translateY(0);} }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes orbitDot { 0%{opacity:0.3} 50%{opacity:1} 100%{opacity:0.3} }
    @keyframes slideIn { from{opacity:0;transform:translateX(-12px)} to{opacity:1;transform:translateX(0)} }

    .name-text { font-family: sans-serif; font-size: 42px; font-weight: 700; fill: #00ff66; filter: url(#glow); animation: fadeUp 0.8s ease both; }
    .role-text { font-family: sans-serif; font-size: 16px; font-weight: 700; fill: #ffffff; letter-spacing: 2px; animation: fadeUp 1s ease 0.2s both; }
    .hello-text { font-family: sans-serif; font-size: 13px; fill: #55dd88; animation: fadeUp 0.6s ease both; }
    .skill-text { font-family: sans-serif; font-size: 12px; fill: #cccccc; }
    .skill-title { font-family: sans-serif; font-size: 13px; font-weight: 700; fill: #00ff66; letter-spacing: 1px; }
    .progress-label { font-family: sans-serif; font-size: 11px; fill: #55dd88; animation: fadeUp 1.4s ease 0.5s both; }
    .pct-text { font-family: sans-serif; font-size: 13px; font-weight: 600; fill: #ffffff; animation: fadeUp 1.4s ease 0.7s both; }
    .orbit1 { animation: spin 4s linear infinite; }
    .orbit2 { animation: spinRev 7s linear infinite; }
    .orbit-dot { animation: orbitDot 2s ease-in-out infinite; }
    .cursor { animation: blink 1s step-end infinite; }
    .bar-fill { animation: fillBar 2s ease 0.8s both; }
    .skill-row { animation: slideIn 0.5s ease both; }
    .skill-row:nth-child(1) { animation-delay: 0.9s; }
    .skill-row:nth-child(2) { animation-delay: 1.1s; }
    .skill-row:nth-child(3) { animation-delay: 1.3s; }
    .skill-row:nth-child(4) { animation-delay: 1.5s; }
  </style>

  <g clip-path="url(#bannerClip)">
    <!-- Background -->
    <rect x="0" y="0" width="680" height="220" fill="#0a0f0a"/>
    <!-- Scanline overlay -->
    <rect x="0" y="0" width="680" height="220" fill="url(#scanlines)"/>

    <!-- Top-left decorative quarter circle -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#00cc55" stroke-width="1.5" opacity="0.5"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#00aa44" stroke-width="1" opacity="0.35"/>
    <path d="M0,0 L68,0 A68,68 0 0,1 0,68 Z" fill="#005522" opacity="0.6"/>

    <!-- LEFT SECTION -->
    <text x="60" y="62" class="hello-text">Hello World</text>
    <text x="58" y="112" class="name-text">Urshitaa</text>
    <text x="60" y="136" class="role-text">AI/ML ENGINEER</text>
    <text x="58" y="172" class="progress-label">Building the future ...</text>

    <!-- Progress bar track -->
    <rect x="58" y="181" width="370" height="14" rx="7" fill="#112211" stroke="#224422" stroke-width="0.5"/>
    <!-- Progress bar fill (animated) -->
    <rect x="58" y="181" width="0" height="14" rx="7" fill="url(#barGrad)" filter="url(#glow)" class="bar-fill"/>
    <!-- 90% label -->
    <text x="440" y="193" class="pct-text">90%</text>

    <!-- CENTER: Atom / Orbit Animation -->
    <circle cx="310" cy="115" r="52" fill="none" stroke="#00ff66" stroke-width="1" stroke-dasharray="4 5" opacity="0.5" class="orbit1"/>
    <circle cx="310" cy="115" r="30" fill="none" stroke="#00cc55" stroke-width="0.8" opacity="0.4" class="orbit2"/>

    <!-- Center nucleus -->
    <circle cx="310" cy="115" r="9" fill="#00cc55" filter="url(#softglow)">
      <animate attributeName="r" values="8;11;8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.75;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="310" cy="115" r="5" fill="#00ff99"/>

    <!-- Orbit dots -->
    <g class="orbit1">
      <circle cx="362" cy="115" r="4" fill="#00ff66" opacity="0.9" class="orbit-dot"/>
      <circle cx="258" cy="115" r="4" fill="#00ff66" opacity="0.4"/>
    </g>
    <g class="orbit2">
      <circle cx="310" cy="85" r="3" fill="#55ffaa" opacity="0.8"/>
      <circle cx="310" cy="145" r="3" fill="#55ffaa" opacity="0.4"/>
    </g>

    <!-- RIGHT: Skills card -->
    <rect x="488" y="28" width="178" height="166" rx="8" fill="#0d1f0f" stroke="#00aa44" stroke-width="1.2" opacity="0.95"/>
    <text x="577" y="52" text-anchor="middle" class="skill-title">WHAT I DO</text>
    <line x1="504" y1="62" x2="650" y2="62" stroke="#00aa44" stroke-width="0.8" opacity="0.7"/>

    <g class="skill-row">
      <circle cx="510" cy="84" r="2.5" fill="#00ff66"/>
      <text x="520" y="88" class="skill-text">Machine Learning</text>
    </g>
    <g class="skill-row">
      <circle cx="510" cy="108" r="2.5" fill="#00ff66"/>
      <text x="520" y="112" class="skill-text">Deep Learning</text>
    </g>
    <g class="skill-row">
      <circle cx="510" cy="132" r="2.5" fill="#00ff66"/>
      <text x="520" y="136" class="skill-text">Full Stack Dev</text>
    </g>
    <g class="skill-row">
      <circle cx="510" cy="156" r="2.5" fill="#00ff66"/>
      <text x="520" y="160" class="skill-text">Debugging Expert 😄</text>
    </g>
  </g>
</svg>
